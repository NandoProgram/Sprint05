<div class="container">
    <div class="row">
        @if(favorito.length==-0){
            <div class="solo">
                Aun no hay Pedidos
            </div>
        }@else {
            @for (p of favorito; track p) {
                <div class="col-sm-12">
                    <app-cards [cuadro]="cuadros[p]" [tipo]="3"  (idAdd)="eliminarPedido($event)"></app-cards>
                </div>
            }
            
            <hr>

        }
        
    </div>
</div>
